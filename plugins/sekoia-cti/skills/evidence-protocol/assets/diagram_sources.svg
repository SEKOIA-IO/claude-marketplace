<!--
  Source layers (RFI). Fill every {{TOKEN}}.
  Left boxes x 20 w 220, right boxes x 520 w 220, row pitch 68, height 44, first row y 20. Height 224 for three rows.
  Edges run from x 240 to x 518. Label each edge with what the source establishes (9px, above the line).
  Hypothesis keeps no incoming edge and the grey note. Delete edges that do not apply.
-->
<figure>
<svg viewBox="0 0 760 224" role="img" aria-label="{{CLAIM}}" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" font-size="10.5" color="#04286A">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Sources -->
  <rect x="20" y="20" width="220" height="44" rx="6" fill="#D3E8FF" stroke="currentColor"/>
  <text x="130" y="38" text-anchor="middle" fill="currentColor"><tspan x="130">{{SOURCE_1_LINE_1}}</tspan><tspan x="130" dy="13">{{SOURCE_1_LINE_2}}</tspan></text>
  <rect x="20" y="88" width="220" height="44" rx="6" fill="#D3E8FF" stroke="currentColor"/>
  <text x="130" y="106" text-anchor="middle" fill="currentColor"><tspan x="130">{{SOURCE_2_LINE_1}}</tspan><tspan x="130" dy="13">{{SOURCE_2_LINE_2}}</tspan></text>
  <rect x="20" y="156" width="220" height="44" rx="6" fill="#D3E8FF" stroke="currentColor"/>
  <text x="130" y="174" text-anchor="middle" fill="currentColor"><tspan x="130">{{SOURCE_3_LINE_1}}</tspan><tspan x="130" dy="13">{{SOURCE_3_LINE_2}}</tspan></text>

  <!-- Statuses -->
  <rect x="520" y="20" width="220" height="44" rx="6" fill="#ffffff" stroke="currentColor"/>
  <text x="630" y="46" text-anchor="middle" fill="currentColor">Observed: technically confirmed</text>
  <rect x="520" y="88" width="220" height="44" rx="6" fill="#ffffff" stroke="currentColor"/>
  <text x="630" y="114" text-anchor="middle" fill="currentColor">Corroborated</text>
  <rect x="520" y="156" width="220" height="44" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="630" y="178" text-anchor="middle" fill="#b45309"><tspan x="630">Hypothesis: not observed</tspan><tspan x="630" dy="13" font-size="9" fill="#6F7376">exposure model, no source</tspan></text>

  <!-- Edges: source 1 -->
  <line x1="240" y1="36" x2="518" y2="36" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="31" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_1_OBS}}</text>
  <line x1="240" y1="52" x2="518" y2="104" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="72" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_1_COR}}</text>
  <!-- Edges: source 2 -->
  <line x1="240" y1="104" x2="518" y2="52" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="95" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_2_OBS}}</text>
  <line x1="240" y1="116" x2="518" y2="116" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="128" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_2_COR}}</text>
  <!-- Edges: source 3 -->
  <line x1="240" y1="172" x2="518" y2="60" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="150" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_3_OBS}}</text>
  <line x1="240" y1="186" x2="518" y2="124" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="380" y="180" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_3_COR}}</text>
</svg>
<figcaption>{{CLAIM}}</figcaption>
</figure>
