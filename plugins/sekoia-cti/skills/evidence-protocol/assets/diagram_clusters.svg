<!--
  Cluster map. Fill every {{TOKEN}}.
  Columns: attribution x 20 w 170 · cluster x 250 w 190 · shared surface x 520 w 200 (one tall box spanning the rows).
  Rows: pitch 64, box height 44, first row y 20. Three rows = height 212. Add a row: copy a <g class="row"> and add 64 to every y.
  A cluster with no attribution relationship keeps the grey text in the left column and no left edge.
  For naming arbitration: left = vendor names, middle = the Sekoia object, right = the aliases box; revoked duplicates use class "revoked" (grey).
-->
<figure>
<svg viewBox="0 0 760 212" role="img" aria-label="{{CLAIM}}" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" font-size="10.5" color="#04286A">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Shared surface, spans all rows -->
  <rect x="520" y="20" width="200" height="172" rx="6" fill="#D3E8FF" stroke="currentColor" stroke-width="1"/>
  <text x="620" y="100" text-anchor="middle" fill="currentColor"><tspan x="620">{{SURFACE_LINE_1}}</tspan><tspan x="620" dy="14">{{SURFACE_LINE_2}}</tspan></text>

  <!-- Row 1 -->
  <g class="row">
    <rect x="20" y="20" width="170" height="44" rx="6" fill="#ffffff" stroke="currentColor" stroke-width="1"/>
    <text x="105" y="38" text-anchor="middle" fill="currentColor"><tspan x="105">{{ATTR_1_LINE_1}}</tspan><tspan x="105" dy="13">{{ATTR_1_LINE_2}}</tspan></text>
    <line x1="250" y1="42" x2="192" y2="42" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="220" y="36" text-anchor="middle" font-size="9" fill="currentColor">{{ATTR_1_EDGE}}</text>
    <rect x="250" y="20" width="190" height="44" rx="6" fill="#D3E8FF" stroke="currentColor" stroke-width="1"/>
    <text x="345" y="38" text-anchor="middle" fill="currentColor"><tspan x="345">{{CLUSTER_1_LINE_1}}</tspan><tspan x="345" dy="13">{{CLUSTER_1_LINE_2}}</tspan></text>
    <line x1="440" y1="42" x2="518" y2="42" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="479" y="36" text-anchor="middle" font-size="9" fill="currentColor">{{ROLE_1}}</text>
  </g>

  <!-- Row 2 -->
  <g class="row">
    <rect x="20" y="84" width="170" height="44" rx="6" fill="#ffffff" stroke="currentColor" stroke-width="1"/>
    <text x="105" y="102" text-anchor="middle" fill="currentColor"><tspan x="105">{{ATTR_2_LINE_1}}</tspan><tspan x="105" dy="13">{{ATTR_2_LINE_2}}</tspan></text>
    <line x1="250" y1="106" x2="192" y2="106" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="220" y="100" text-anchor="middle" font-size="9" fill="currentColor">{{ATTR_2_EDGE}}</text>
    <rect x="250" y="84" width="190" height="44" rx="6" fill="#D3E8FF" stroke="currentColor" stroke-width="1"/>
    <text x="345" y="102" text-anchor="middle" fill="currentColor"><tspan x="345">{{CLUSTER_2_LINE_1}}</tspan><tspan x="345" dy="13">{{CLUSTER_2_LINE_2}}</tspan></text>
    <line x1="440" y1="106" x2="518" y2="106" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="479" y="100" text-anchor="middle" font-size="9" fill="currentColor">{{ROLE_2}}</text>
  </g>

  <!-- Row 3: no attribution relationship -->
  <g class="row">
    <text x="105" y="170" text-anchor="middle" font-size="9" fill="#6F7376"><tspan x="105">no attributed-to</tspan><tspan x="105" dy="12">relationship returned</tspan></text>
    <rect x="250" y="148" width="190" height="44" rx="6" fill="#D3E8FF" stroke="currentColor" stroke-width="1"/>
    <text x="345" y="166" text-anchor="middle" fill="currentColor"><tspan x="345">{{CLUSTER_3_LINE_1}}</tspan><tspan x="345" dy="13">{{CLUSTER_3_LINE_2}}</tspan></text>
    <line x1="440" y1="170" x2="518" y2="170" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="479" y="164" text-anchor="middle" font-size="9" fill="currentColor">{{ROLE_3}}</text>
  </g>
</svg>
<figcaption>{{CLAIM}}</figcaption>
</figure>
