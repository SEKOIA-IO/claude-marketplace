<!--
  Evidence tree (delta brief). Fill every {{TOKEN}}.
  Root pill x 20 w 180 h 46 centred at y 110. Branch boxes x 520 w 220 h 44 at y 20, 88, 156.
  Edge labels carry the relationship confidence and "direct" or "chained". Leaf text carries the CALCULATED RESULT counts.
-->
<figure>
<svg viewBox="0 0 760 220" role="img" aria-label="{{CLAIM}}" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" font-size="10.5" color="#04286A">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="87" width="180" height="46" rx="23" fill="#D3E8FF" stroke="currentColor"/>
  <text x="110" y="106" text-anchor="middle" fill="currentColor"><tspan x="110">{{ROOT_LINE_1}}</tspan><tspan x="110" dy="13">{{ROOT_LINE_2}}</tspan></text>

  <line x1="200" y1="100" x2="518" y2="42" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="360" y="58" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_1}}</text>
  <rect x="520" y="20" width="220" height="44" rx="6" fill="#ffffff" stroke="currentColor"/>
  <text x="630" y="38" text-anchor="middle" fill="currentColor"><tspan x="630">{{LEAF_1_LINE_1}}</tspan><tspan x="630" dy="13">{{LEAF_1_LINE_2}}</tspan></text>

  <line x1="200" y1="110" x2="518" y2="110" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="360" y="105" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_2}}</text>
  <rect x="520" y="88" width="220" height="44" rx="6" fill="#ffffff" stroke="currentColor"/>
  <text x="630" y="106" text-anchor="middle" fill="currentColor"><tspan x="630">{{LEAF_2_LINE_1}}</tspan><tspan x="630" dy="13">{{LEAF_2_LINE_2}}</tspan></text>

  <line x1="200" y1="120" x2="518" y2="178" stroke="currentColor" marker-end="url(#arrow)"/>
  <text x="360" y="162" text-anchor="middle" font-size="9" fill="currentColor">{{EDGE_3}}</text>
  <rect x="520" y="156" width="220" height="44" rx="6" fill="#ffffff" stroke="currentColor"/>
  <text x="630" y="174" text-anchor="middle" fill="currentColor"><tspan x="630">{{LEAF_3_LINE_1}}</tspan><tspan x="630" dy="13">{{LEAF_3_LINE_2}}</tspan></text>
</svg>
<figcaption>{{CLAIM}}</figcaption>
</figure>
